<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
<style>
  :root{
    color-scheme:light;
    --ink:#111111;
    --ink-soft:#3a3a3a;
    --gray:#777777;
    --gray-light:#a8a8a8;
    --line:#e4e4e4;
    --paper:#ffffff;
    --wash:#f6f6f6;
    --serif:"Noto Serif SC","Songti SC","SimSun","Source Han Serif SC",serif;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --calligraphy:"Ma Shan Zheng","Noto Serif SC","Songti SC","SimSun",serif;
    --header-h:64px;
    --maxw:1120px;
    --measure:680px;
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --ink:#f2f2f2;
    --ink-soft:#c8c8c8;
    --gray:#999999;
    --gray-light:#5f5f5f;
    --line:#2f2f2f;
    --paper:#0d0d0d;
    --wash:#171717;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    width:100%;
  }
  html{overflow-x:hidden;width:100%}
  /* 主题切换时的平滑颜色过渡 */
  body, body *{
    transition: background-color .45s ease, color .45s ease, border-color .45s ease;
  }
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  ul{list-style:none}

  /* ===== 顶部导航 ===== */
  .site-header{
    position:sticky;top:0;z-index:50;
    height:var(--header-h);
    background:var(--paper);
    border-bottom:1px solid var(--ink);
    display:flex;align-items:center;
  }
  .site-header__inner{
    width:100%;max-width:var(--maxw);
    margin:0 auto;padding:0 28px;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .avatar{
    flex:none;border-radius:50%;object-fit:cover;
    background:var(--wash);border:1px solid var(--line);
  }
  .avatar--xs{width:26px;height:26px}
  .avatar--sm{width:34px;height:34px}
  .avatar--md{width:46px;height:46px}
  .avatar--lg{width:92px;height:92px;border-width:2px}
  .brand__name{
    font-family:var(--serif);font-weight:900;font-size:19px;
    letter-spacing:.06em;
  }
  .site-nav{display:flex;align-items:center;gap:8px}
  .site-nav a{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:44px;padding:0 16px;
    font-size:14px;font-weight:500;letter-spacing:.08em;
    color:var(--ink-soft);
    position:relative;
    transition:color .25s, background-color .45s ease, border-color .45s ease;
  }
  .site-nav a::after{
    content:"";position:absolute;left:16px;right:16px;bottom:6px;
    height:1px;background:var(--ink);
    transform:scaleX(0);transform-origin:left;
    transition:transform .25s ease;
  }
  .site-nav a:hover{color:var(--ink)}
  .site-nav a:hover::after{transform:scaleX(1)}
  .site-nav a.is-active{color:var(--ink)}
  .site-nav a.is-active::after{transform:scaleX(1)}

  .header-actions{display:flex;align-items:center;gap:8px}

  /* 白天/黑夜切换按钮 */
  .theme-toggle{
    width:44px;height:44px;flex:none;
    position:relative;display:grid;place-items:center;
    background:var(--wash);border:1px solid var(--line);border-radius:50%;
    color:var(--ink);cursor:pointer;
  }
  .theme-toggle:hover{border-color:var(--ink)}
  .theme-toggle svg{
    position:absolute;
    transition:opacity .5s ease, transform .55s cubic-bezier(.4,0,.2,1);
  }
  .theme-toggle .icon-sun{opacity:1;transform:rotate(0deg) scale(1)}
  .theme-toggle .icon-moon{opacity:0;transform:rotate(90deg) scale(.3)}
  html[data-theme="dark"] .theme-toggle .icon-sun{opacity:0;transform:rotate(-90deg) scale(.3)}
  html[data-theme="dark"] .theme-toggle .icon-moon{opacity:1;transform:rotate(0deg) scale(1)}

  /* ===== 毛玻璃模式 ===== */
  .glass-toggle{
    width:44px;height:44px;flex:none;
    position:relative;display:grid;place-items:center;
    background:var(--wash);border:1px solid var(--line);border-radius:50%;
    color:var(--ink);cursor:pointer;
    transition:background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease;
  }
  .glass-toggle:hover{border-color:var(--ink)}
  .glass-toggle.is-active{
    background:var(--ink);color:var(--paper);border-color:var(--ink);
    box-shadow:0 0 0 1px var(--ink),0 4px 14px rgba(0,0,0,.18);
  }
  html.glass-mode{
    background:
      radial-gradient(circle at 18% 22%, rgba(140,140,170,.10), transparent 42%),
      radial-gradient(circle at 82% 78%, rgba(120,120,150,.08), transparent 42%),
      var(--paper);
  }
  html.glass-mode[data-theme="dark"]{
    background:
      radial-gradient(circle at 20% 18%, rgba(70,70,110,.30), transparent 45%),
      radial-gradient(circle at 78% 82%, rgba(50,50,90,.24), transparent 45%),
      var(--paper);
  }
  html.glass-mode .site-header{
    z-index:50;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border-bottom:1px solid rgba(0,0,0,.08);
  }
  html.glass-mode[data-theme="dark"] .site-header{
    background:rgba(18,18,22,.50);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  html.glass-mode .profile,
  html.glass-mode .post-item,
  html.glass-mode .group-card__inner{
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(12px) saturate(150%);
    -webkit-backdrop-filter:blur(12px) saturate(150%);
    border-color:rgba(0,0,0,.10);
  }
  html.glass-mode[data-theme="dark"] .profile,
  html.glass-mode[data-theme="dark"] .post-item,
  html.glass-mode[data-theme="dark"] .group-card__inner{
    background:rgba(30,30,36,.45);
    border-color:rgba(255,255,255,.10);
  }
  html.glass-mode .profile__link,
  html.glass-mode .theme-toggle,
  html.glass-mode .glass-toggle:not(.is-active){
    background:rgba(255,255,255,.50);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  html.glass-mode[data-theme="dark"] .profile__link,
  html.glass-mode[data-theme="dark"] .theme-toggle,
  html.glass-mode[data-theme="dark"] .glass-toggle:not(.is-active){
    background:rgba(40,40,46,.50);
  }
  .rain-layer{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    opacity:0;transition:opacity .8s ease;overflow:hidden;
  }
  html.glass-mode[data-theme="dark"] .rain-layer{opacity:.7}
  .rain-layer span{
    position:absolute;top:-25%;
    width:2px;
    background:linear-gradient(transparent, rgba(195,210,235,.65));
    animation:rain-fall linear infinite;
    transform:rotate(8deg);
  }
  @keyframes rain-fall{
    0%{transform:translateY(-20vh)}
    100%{transform:translateY(125vh)}
  }
  .mist-layer{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    opacity:0;transition:opacity 1s ease;
    background:
      radial-gradient(ellipse 55% 35% at 25% 35%, rgba(200,210,235,.10), transparent 70%),
      radial-gradient(ellipse 45% 30% at 75% 65%, rgba(180,195,225,.08), transparent 70%),
      radial-gradient(ellipse 65% 40% at 50% 90%, rgba(190,200,230,.06), transparent 70%);
    filter:blur(24px);
    animation:mist-float 14s ease-in-out infinite alternate;
  }
  html.glass-mode[data-theme="dark"] .mist-layer{opacity:1}
  @keyframes mist-float{
    0%{transform:translate(0,0) scale(1)}
    100%{transform:translate(4%,-3%) scale(1.1)}
  }

  /* 主题切换时的圆形扩散动画层 */
  .theme-ripple{
    position:fixed;z-index:99;pointer-events:none;
    width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;
    transform:scale(0);
    transition:transform .65s cubic-bezier(.3,0,.1,1);
  }
  .theme-ripple.is-dark{background:#0d0d0d}
  .theme-ripple.is-light{background:#ffffff}

  .hamburger{
    display:none;
    width:44px;height:44px;
    background:none;border:1px solid transparent;border-radius:4px;
    cursor:pointer;align-items:center;justify-content:center;
  }
  .hamburger span{
    display:block;width:22px;height:1.6px;background:var(--ink);
    position:relative;transition:background .2s;
  }
  .hamburger span::before,.hamburger span::after{
    content:"";position:absolute;left:0;width:22px;height:1.6px;background:var(--ink);
    transition:transform .25s ease,top .25s ease;
  }
  .hamburger span::before{top:-7px}
  .hamburger span::after{top:7px}
  .hamburger.is-open span{background:transparent}
  .hamburger.is-open span::before{top:0;transform:rotate(45deg)}
  .hamburger.is-open span::after{top:0;transform:rotate(-45deg)}

  .mobile-menu{
    position:fixed;inset:0;z-index:40;
    background:var(--paper);
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    padding:0 32px;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .25s ease,visibility .25s ease;
  }
  .mobile-menu.is-open{opacity:1;visibility:visible;pointer-events:auto}
  .mobile-menu a{
    display:flex;align-items:center;min-height:56px;
    font-family:var(--serif);font-weight:700;font-size:26px;
    border-bottom:1px solid var(--line);
    width:100%;margin-bottom:4px;
  }
  .mobile-menu a .idx{font-family:var(--sans);font-size:13px;color:var(--gray);margin-right:14px;font-weight:400}

  /* ===== 主容器 ===== */
  .page{width:100%}
  .view{display:none}
  .view.is-active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}

  /* ===== Hero ===== */
  .hero{
    padding:88px 0 64px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .hero__title{
    font-family:var(--serif);font-weight:900;
    font-size:clamp(56px,11vw,108px);
    letter-spacing:.04em;line-height:1.05;
  }
  .hero__sub{
    margin-top:24px;
    font-size:clamp(15px,2.4vw,18px);
    color:var(--gray);letter-spacing:.2em;
    min-height:1.9em;
    display:inline-flex;align-items:baseline;
  }
  .typewriter-caret{
    display:inline-block;width:2px;height:1.1em;
    background:var(--ink);margin-left:2px;vertical-align:-0.15em;
    animation:blink .85s steps(1) infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .hero__rule{
    width:56px;height:1px;background:var(--ink);margin-top:44px;
  }

  /* ===== 首页两栏布局 ===== */
  .home-layout{
    display:grid;grid-template-columns:280px minmax(0,1fr);
    gap:40px;align-items:start;padding-bottom:48px;
  }
  .profile{
    position:sticky;top:calc(var(--header-h) + 24px);
    border:1px solid var(--line);background:var(--wash);
    padding:30px 24px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
    max-width:100%;
    overflow:hidden;
    box-sizing:border-box;
  }
  .profile .avatar{width:72px;height:72px;border-width:2px}
  .profile__name{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:.06em}
  .profile__bio{font-size:13.5px;color:var(--gray);line-height:1.8}
  .profile__facts{font-size:12.5px;color:var(--gray-light);letter-spacing:.08em}
  .profile__facts b{color:var(--ink);font-weight:600}
  .profile__link{
    width:100%;justify-content:center;
    margin-top:8px;display:inline-flex;align-items:center;gap:8px;
    min-height:44px;padding:0 20px;border:1px solid var(--ink);
    font-size:13px;letter-spacing:.1em;
    transition:background-color .3s ease,color .3s ease,border-color .3s ease;
  }
  .profile__link:hover{background:var(--ink);color:var(--paper)}

  /* ===== 文章列表 ===== */
  .section-head{
    display:flex;align-items:baseline;gap:14px;
    padding-bottom:14px;border-bottom:2px solid var(--ink);
    margin-bottom:36px;
  }
  .section-head__title{
    font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.1em;
  }
  .section-head__count{font-size:12px;color:var(--gray);letter-spacing:.1em}

  .post-item{
    border:1px solid var(--line);background:var(--paper);
    cursor:pointer;margin-bottom:32px;overflow:hidden;
    transition:border-color .3s ease, box-shadow .3s ease, background-color .45s ease, color .45s ease;
  }
  .post-item:hover{border-color:var(--ink)}
  .post-item__media{overflow:hidden;background:var(--wash);border-radius:12px}
  .group-cover{
    position:relative;width:100%;aspect-ratio:16/8;
    display:flex;align-items:center;gap:clamp(16px,3vw,32px);
    padding:0 clamp(18px,4vw,36px);
    background:#1a1a1c;
  }
  .group-cover__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .group-cover::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(8,8,10,.92) 0%,rgba(8,8,10,.72) 40%,rgba(8,8,10,.35) 100%);
  }
  .group-cover__info{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .group-cover__name{
    font-family:var(--serif);font-weight:900;color:#fff;
    font-size:clamp(20px,3.2vw,34px);line-height:1.25;letter-spacing:.04em;
    text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 20px rgba(0,0,0,.6);
  }
  .group-cover__tip{font-size:12px;letter-spacing:.16em;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.8)}
  .group-cover__qr{
    position:relative;z-index:1;flex:none;
    width:clamp(92px,18vw,150px);aspect-ratio:1/1;
    background:#fff;padding:8px;border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .group-cover__qr img{width:100%;height:100%;object-fit:contain}
  .post-item__media img{
    width:100%;aspect-ratio:16/8;object-fit:cover;
    transition:transform .5s ease;
  }
  .post-item:hover .post-item__media > img{transform:scale(1.03)}
  .post-item__body{padding:24px 26px 22px;display:flex;flex-direction:column;gap:12px}
  .post-item__meta{
    display:flex;align-items:center;gap:14px;
    font-size:12px;color:var(--gray);letter-spacing:.12em;
  }
  .post-item__tag{border:1px solid var(--line);padding:2px 10px;font-size:11px;color:var(--ink-soft)}
  .post-item__title{
    font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.4;
  }
  .post-item__title:hover{text-decoration:underline}
  .post-item__excerpt{
    font-size:14.5px;color:var(--ink-soft);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .post-item__foot{
    display:flex;align-items:center;gap:16px;
    font-size:12px;color:var(--gray-light);letter-spacing:.08em;margin-top:2px;
  }
  .post-item__more{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
    color:var(--ink);font-weight:500;letter-spacing:.14em;
  }
  .post-item__more svg{transition:transform .25s ease}
  .post-item:hover .post-item__more svg{transform:translateX(4px)}

  /* ===== 文章详情 ===== */
  .post-header{padding:64px 0 40px;text-align:center}
  .post-header__tag{
    display:inline-block;font-size:12px;color:var(--gray);letter-spacing:.2em;
    border:1px solid var(--line);padding:4px 14px;margin-bottom:24px;
  }
  .post-header__title{
    font-family:var(--serif);font-weight:900;
    font-size:clamp(30px,5vw,46px);line-height:1.3;
    max-width:760px;margin:0 auto;
  }
  .post-header__meta{
    margin-top:20px;font-size:13px;color:var(--gray);letter-spacing:.14em;
  }
  .post-cover{margin:0 auto 48px;max-width:960px;padding:0 28px}
  .post-cover img{width:100%;height:auto;border:1px solid var(--line);border-radius:14px}
  .group-card{max-width:960px;margin:0 auto 40px;padding:0 28px}
  .group-card__inner{
    border:1px solid var(--ink);background:var(--wash);
    padding:28px;display:flex;align-items:center;gap:28px;
  }
  .group-card__info{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
  .group-card__label{font-size:12px;color:var(--gray);letter-spacing:.18em}
  .group-card__number{
    font-family:var(--serif);font-weight:900;
    font-size:clamp(30px,5vw,46px);letter-spacing:.06em;line-height:1.2;
    background:var(--ink);color:var(--paper);padding:8px 18px;
  }
  .group-card__tip{font-size:13px;color:var(--gray)}
  .group-card__qr{
    width:150px;height:150px;flex:none;
    background:#ffffff;border:1px solid var(--line);padding:8px;
  }
  .group-card__qr img{width:100%;height:100%;object-fit:contain}
  .post-body{
    max-width:var(--measure);margin:0 auto;padding:0 28px 24px;
    font-family:var(--serif);font-size:17.5px;line-height:2.05;color:var(--ink-soft);
  }
  .post-body p{margin-bottom:1.6em}
  .post-body p:first-child::first-letter{
    font-size:3em;float:left;line-height:.9;padding-right:12px;color:var(--ink);
    font-weight:700;
  }
  .post-end{
    max-width:var(--measure);margin:0 auto;padding:48px 28px 80px;
    display:flex;align-items:center;gap:16px;
  }
  .post-end__line{flex:1;height:1px;background:var(--line)}
  .post-end__sign{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--gray)}

  /* ===== 归档 ===== */
  .archive{padding:56px 0 96px}
  .archive__head{
    display:flex;align-items:baseline;gap:16px;margin-bottom:30px;
    border-bottom:1px solid var(--ink);padding-bottom:18px;
  }
  .archive__count{font-size:13px;color:var(--gray);letter-spacing:.1em}
  .archive__group{margin-bottom:34px}
  .archive__group-title{
    font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.18em;
    color:var(--gray);margin-bottom:10px;
  }
  .archive__list{border-top:1px solid var(--line)}
  .archive__item{
    display:flex;align-items:baseline;gap:24px;
    padding:16px 4px;border-bottom:1px solid var(--line);
    transition:background-color .3s ease, padding-left .3s ease;
  }
  .archive__item:hover{background:var(--wash);padding-left:12px}
  .archive__item-time{flex:none;font-size:13px;color:var(--gray);letter-spacing:.08em;font-variant-numeric:tabular-nums}
  .archive__item-title{font-family:var(--serif);font-weight:600;font-size:17px}
  .archive__item-tag{
    flex:none;font-size:11px;color:var(--gray);letter-spacing:.14em;
    border:1px solid var(--line);border-radius:99px;padding:2px 10px;
  }

  /* ===== 回到顶部 ===== */
  .back-top{
    position:fixed;right:22px;bottom:118px;z-index:55;
    width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--paper);border:1px solid var(--ink);color:var(--ink);
    cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);
    transition:opacity .3s ease, transform .3s ease, background-color .45s ease, border-color .45s ease;
  }
  .back-top.is-visible{opacity:1;pointer-events:auto;transform:translateY(0)}
  .back-top:hover{background:var(--wash)}
  @media (max-width:640px){
    .back-top{bottom:128px;right:16px}
    .archive__item{gap:14px}
    .archive__item-tag{display:none}
  }
  .post-nav{
    border-top:1px solid var(--ink);
    display:grid;grid-template-columns:1fr 1fr;max-width:var(--maxw);margin:0 auto;
  }
  .post-nav a{
    min-height:92px;display:flex;flex-direction:column;justify-content:center;gap:6px;
    padding:20px 28px;
  }
  .post-nav a:first-child{border-right:1px solid var(--ink);align-items:flex-start;text-align:left}
  .post-nav a:last-child{align-items:flex-end;text-align:right}
  .post-nav a:hover{background:var(--wash)}
  .post-nav__label{font-size:12px;color:var(--gray);letter-spacing:.16em}
  .post-nav__title{font-family:var(--serif);font-weight:600;font-size:16px}
  /* 留言板 */
  .comments-section{
    margin-top:48px;
    padding-top:32px;
    border-top:1px solid var(--line);
  }
  .comments-title{
    font-family:var(--serif);
    font-size:20px;
    font-weight:700;
    margin-bottom:20px;
    letter-spacing:.08em;
  }
  #cusdis_thread{
    --cusdis-bg:var(--paper);
    --cusdis-text-color:var(--ink);
    --cusdim-cursor-color:var(--ink);
  }
  .post-nav__title.is-disabled{color:var(--gray-light)}

  /* 阅读进度 */
  .progress{
    position:fixed;top:0;left:0;height:2px;width:0;background:var(--ink);z-index:60;
    transition:width .1s linear;
  }

  /* ===== 关于页 ===== */
  .about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;padding:80px 0 100px;align-items:start}
  .about__media img{border:1px solid var(--line)}
  .about__head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .about__head .avatar{width:48px;height:48px}
  .about__title{font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.06em}
  .about__body{font-family:var(--serif);font-size:16.5px;line-height:2.05;color:var(--ink-soft)}
  .about__body p{margin-bottom:1.5em}
  .about__facts{
    margin-top:34px;border-top:1px solid var(--line);padding-top:22px;
    display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--gray);letter-spacing:.08em;
  }
  .about__facts b{color:var(--ink);font-weight:600}

  /* ===== 页脚 ===== */
  .site-footer{border-top:1px solid var(--ink);margin-top:40px}
  .site-footer__inner{
    max-width:var(--maxw);margin:0 auto;padding:28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    font-size:12.5px;color:var(--gray);letter-spacing:.1em;
  }
  .site-footer .avatar{width:26px;height:26px}

  /* ===== 响应式 ===== */
  @media (max-width:768px){
    .site-header__inner,.wrap{padding-left:20px;padding-right:20px}
    .site-nav{display:none}
    .hamburger{display:flex}
    .hero{padding:64px 0 48px}
    .home-layout{grid-template-columns:1fr;gap:32px}
    .profile{position:static}
    .post-item__body{padding:20px 20px 18px}
    .post-item__title{font-size:21px}
    .about{grid-template-columns:1fr;gap:36px;padding:56px 0 72px}
    .about__media{order:-1}
    .post-nav{grid-template-columns:1fr}
    .post-nav a:first-child{border-right:none;border-bottom:1px solid var(--ink)}
    .post-body{font-size:16.5px}
    .group-card__inner{flex-direction:column;align-items:flex-start;padding:24px}
    .group-card__qr{width:100%;height:auto;aspect-ratio:1/1}
  }
  @media (max-width:400px){
    .hero__sub{letter-spacing:.12em}
  }

  /* ===== 书法标题字体 ===== */
  .brand__name,
  .hero__title,
  .post-header__title,
  .profile__name,
  .section-head__title,
  .group-cover__name,
  .post-item__title,
  .about__title,
  .post-end__sign,
  h1, h2, h3{
    font-family: var(--calligraphy);
    font-weight: 400;
    letter-spacing: .04em;
  }

  /* ===== 刷新彩蛋 ===== */
  @font-face{
    font-family:'Zpix';
    src:url('zpix.woff2') format('woff2');
    font-display:swap;
  }
  .secret-layer{
    position:fixed;inset:0;z-index:200;
    display:grid;place-items:center;
    background:#000;
    opacity:0;pointer-events:none;
    transition:opacity .6s ease;
    touch-action:none;
  }
  .secret-layer.show{opacity:1;pointer-events:auto}
  .secret-layer video{
    width:100%;height:100%;object-fit:contain;
    background:#000;display:block;
  }
  /* 彩蛋触发前的过渡文字 */
  .secret-intro{
    position:fixed;inset:0;z-index:205;
    background:#000;
    display:none;
    align-items:center;justify-content:center;
    font-family:'Zpix', monospace;
    color:#fff;
    font-size:30px;
    letter-spacing:6px;
    text-align:center;
    padding:20px;
    touch-action:none;
  }
  .secret-intro.show{display:flex}
  .secret-intro.flash{animation:secretFlash .45s ease}
  @keyframes secretFlash{
    0%{background:#000;color:#fff}
    50%{background:#fff;color:#000}
    100%{background:#000;color:#fff}
  }
  /* ===== 音乐播放器（黑白适配） ===== */
  .music-box{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--line);
    width:100%;
    max-width:100%;
    overflow:hidden;
    box-sizing:border-box;
  }
  /* 音乐播放器固定在底部，跟随滚动 */
  .music-box{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:60;
    margin-top:0;
    padding:10px 16px;
    border-top:1px solid var(--line);
    border-radius:0;
    background:var(--paper);
    box-shadow:0 -2px 12px rgba(0,0,0,.08);
  }
  .music-box .aplayer{
    max-width:var(--maxw);
    margin:0 auto;
  }
  .music-box__title{display:none}
  /* 切换歌单按钮：播放器右上角小药丸 */
  .music-search{
    position:absolute;
    top:8px;
    right:8px;
    z-index:20;
  }
  .music-search button{
    background:rgba(0,0,0,.5);
    color:#fff;
    border:1px solid rgba(255,255,255,.15);
    padding:3px 10px;
    font-size:10px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    letter-spacing:.05em;
    white-space:nowrap;
    transition:all .2s ease;
  }
  .music-search button:hover{background:rgba(0,0,0,.7)}
  .music-search button:active{transform:scale(.93)}
  .music-search button:disabled{opacity:.5;cursor:not-allowed}
  /* 浅色模式：半透明白底黑字 */
  html:not([data-theme="dark"]) .music-search button{
    background:rgba(255,255,255,.75);
    color:var(--ink);
    border:1px solid rgba(0,0,0,.1);
  }
  html:not([data-theme="dark"]) .music-search button:hover{background:rgba(255,255,255,.95)}
  /* 页面底部留空，避免被播放器遮挡 */
  body{padding-bottom:90px}
  @media (max-width:640px){
    body{padding-bottom:80px}
    .music-box{padding:8px 12px}
  }
  .music-box__title{
    font-size:11px;
    color:var(--gray-light);
    letter-spacing:.16em;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .aplayer{
    background:var(--paper) !important;
    border:1px solid var(--line) !important;
    border-radius:8px !important;
    font-family:inherit !important;
    box-shadow:none !important;
    overflow:hidden;
    width:100% !important;
    max-width:100% !important;
  }
  .aplayer .aplayer-body{background:var(--paper) !important;width:100% !important}
  .aplayer .aplayer-info{min-width:0 !important;flex:1 !important}
  .aplayer .aplayer-music{min-width:0 !important;overflow:hidden !important}
  .aplayer .aplayer-pic{background-size:cover;background-position:center;flex-shrink:0}
  .aplayer .aplayer-info .aplayer-music .aplayer-title{color:var(--ink) !important;font-size:13px !important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .aplayer .aplayer-info .aplayer-music .aplayer-author{color:var(--gray-light) !important;font-size:11px !important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  /* 隐藏歌手名，只留歌曲标题 */
  .aplayer .aplayer-info .aplayer-music .aplayer-author{display:none !important}
  .aplayer .aplayer-list ol li .aplayer-list-author{display:none !important}
  .aplayer .aplayer-controller{min-width:0 !important}
  .aplayer .aplayer-controller .aplayer-time{color:var(--gray-light) !important;min-width:0}
  .aplayer .aplayer-button{color:var(--ink) !important}
  .aplayer .aplayer-button:hover{opacity:.6}
  .aplayer .aplayer-bar-wrap .aplayer-bar .aplayer-played{background:var(--ink) !important}
  .aplayer .aplayer-bar-wrap .aplayer-bar .aplayer-loaded{background:var(--line) !important}
  .aplayer .aplayer-list{background:var(--paper) !important;border-top:1px solid var(--line) !important;max-height:240px;overflow-y:auto}
  .aplayer .aplayer-list ol li{color:var(--ink-soft) !important;border-top:1px solid var(--line) !important;font-size:12px !important}
  .aplayer .aplayer-list ol li:hover{background:var(--line) !important}
  .aplayer .aplayer-list ol li.aplayer-list-light{color:var(--ink) !important;background:var(--line) !important}
  .aplayer .aplayer-list ol li .aplayer-list-index{color:var(--gray-light) !important}
  .aplayer .aplayer-lrc{background:var(--paper) !important}
  .aplayer .aplayer-lrc p{color:var(--gray-light) !important}
  .aplayer .aplayer-lrc p.aplayer-lrc-current{color:var(--ink) !important}
  /* 手机端播放器适配（只缩文字，不动布局结构） */
  @media (max-width:640px){
    .aplayer .aplayer-info .aplayer-music .aplayer-title{font-size:12px !important}
    .aplayer .aplayer-info .aplayer-music .aplayer-author{font-size:10px !important}
    .aplayer .aplayer-list{max-height:180px !important}
    .aplayer .aplayer-list ol li{font-size:11px !important}
    .music-box{padding:8px 12px}
  }
  /* 毛玻璃模式下播放器适配 */
  html.glass-mode .music-box{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    padding:14px;
    border-top:none;
    margin-top:14px;
  }
  /* 毛玻璃模式下固定底部播放器 */
  html.glass-mode .music-box{
    background:rgba(20,20,26,.6);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border-top:1px solid rgba(255,255,255,.1);
    border-radius:0;
    box-shadow:0 -2px 20px rgba(0,0,0,.3);
  }
  /* 浅色毛玻璃：固定底部播放器 */
  html.glass-mode:not([data-theme="dark"]) .music-box{
    background:rgba(255,255,255,.65);
    border-top:1px solid rgba(0,0,0,.08);
    box-shadow:0 -2px 20px rgba(0,0,0,.06);
  }
  /* 浅色毛玻璃：音乐盒半透明白+淡黑边框 */
  html.glass-mode:not([data-theme="dark"]) .music-box{
    background:rgba(255,255,255,.55);
    border:1px solid rgba(0,0,0,.08);
  }
  html.glass-mode .aplayer{
    background:rgba(255,255,255,.06) !important;
    border:1px solid rgba(255,255,255,.1) !important;
  }
  html.glass-mode:not([data-theme="dark"]) .aplayer{
    background:rgba(255,255,255,.5) !important;
    border:1px solid rgba(0,0,0,.08) !important;
  }
  html.glass-mode .aplayer .aplayer-body{background:transparent !important}
  html.glass-mode .music-search button{
    background:rgba(255,255,255,.15);
    color:#fff;
  }
  html.glass-mode:not([data-theme="dark"]) .music-search button{
    background:rgba(0,0,0,.06);
    color:var(--ink);
  }
  /* 浅色毛玻璃：雨滴淡灰蓝 */
  html.glass-mode:not([data-theme="dark"]) .rain-layer{opacity:.35}
  html.glass-mode:not([data-theme="dark"]) .rain-layer span{
    background:linear-gradient(transparent, rgba(100,110,140,.4));
  }
  /* 浅色毛玻璃：水雾淡色 */
  html.glass-mode:not([data-theme="dark"]) .mist-layer{opacity:.6}
  /* 浅色毛玻璃：按钮文字用主题色 */
  html.glass-mode:not([data-theme="dark"]) .profile__link,
  html.glass-mode:not([data-theme="dark"]) .theme-toggle,
  html.glass-mode:not([data-theme="dark"]) .glass-toggle:not(.is-active){
    color:var(--ink);
  }
  /* ===== 交互增强 ===== */
  :root{ --ease-out:cubic-bezier(.2,.7,.2,1); }

  /* 页面切换：淡入 + 轻微上浮 + 去模糊 */
  .view.is-active{animation:view-in .55s var(--ease-out) both}
  @keyframes view-in{
    from{opacity:0;transform:translateY(14px);filter:blur(6px)}
    to{opacity:1;transform:none;filter:none}
  }

  /* 滚动进入 */
  [data-reveal]{
    opacity:0;transform:translateY(22px);
    transition:opacity .8s var(--ease-out) var(--reveal-delay,0ms),
               transform .8s var(--ease-out) var(--reveal-delay,0ms);
  }
  [data-reveal].is-revealed{opacity:1;transform:none}

  /* Hero 标题逐字入场 + 横线展开 */
  .hero__title{display:inline-flex;justify-content:center;flex-wrap:wrap}
  .hero__title .char{
    display:inline-block;
    opacity:0;transform:translateY(.35em) rotate(2deg);
    animation:char-in .9s var(--ease-out) forwards;
    animation-delay:calc(var(--i,0) * 90ms + 120ms);
  }
  @keyframes char-in{to{opacity:1;transform:none}}
  .hero__rule{width:0;transition:width 1s var(--ease-out) .45s}
  .hero__rule.is-drawn{width:56px}

  /* 导航滚动后加一层阴影 */
  .site-header{transition:background-color .45s ease,box-shadow .35s ease,border-color .45s ease}
  .site-header.is-scrolled{box-shadow:0 8px 30px rgba(0,0,0,.06)}
  html[data-theme="dark"] .site-header.is-scrolled{box-shadow:0 8px 30px rgba(0,0,0,.4)}

  /* 文章卡片：抬升 + 跟随鼠标的墨色光斑 */
  .post-item{
    position:relative;
    transition:transform .45s var(--ease-out),border-color .3s ease,
               box-shadow .45s var(--ease-out),background-color .45s ease;
  }
  .post-item::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%), rgba(0,0,0,.055), transparent 65%);
    opacity:0;transition:opacity .4s ease;
  }
  html[data-theme="dark"] .post-item::after{
    background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.07), transparent 65%);
  }
  @media (hover:hover){
    .post-item:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.09)}
    html[data-theme="dark"] .post-item:hover{box-shadow:0 18px 40px rgba(0,0,0,.55)}
    .post-item:hover::after{opacity:1}
    .post-item__media img{transition:transform .7s var(--ease-out),filter .7s ease}
    .post-item:hover .post-item__media > img{transform:scale(1.06)}
  }

  /* 群号：点击复制 */
  .group-card__number{
    border:0;cursor:pointer;text-align:left;display:inline-block;
    font-family:var(--calligraphy);font-weight:900;
    transition:transform .3s var(--ease-out),opacity .3s ease;
  }
  .group-card__number:hover{transform:translateY(-2px);opacity:.88}
  .group-card__number:active{transform:scale(.97)}

  /* 返回顶部：环形进度 */
  .back-top__ring{
    position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);
    pointer-events:none;
  }
  .back-top__ring circle{
    fill:none;stroke:var(--ink);stroke-width:2;opacity:.45;
    stroke-dasharray:132;
    stroke-dashoffset:calc(132 - 132 * var(--p,0));
  }

  /* 轻提示 */
  .toast{
    position:fixed;left:50%;bottom:112px;z-index:120;
    transform:translate(-50%,14px);
    background:var(--ink);color:var(--paper);
    padding:10px 18px;border-radius:999px;
    font-size:13px;letter-spacing:.08em;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease,transform .35s var(--ease-out);
  }
  .toast.is-show{opacity:1;transform:translate(-50%,0)}

  /* 移动端菜单逐项滑入 */
  .mobile-menu a{
    opacity:0;transform:translateY(18px);
    transition:opacity .5s var(--ease-out),transform .5s var(--ease-out);
  }
  .mobile-menu.is-open a{opacity:1;transform:none}
  .mobile-menu a:nth-child(1){transition-delay:.05s}
  .mobile-menu a:nth-child(2){transition-delay:.11s}
  .mobile-menu a:nth-child(3){transition-delay:.17s}
  .mobile-menu a:nth-child(4){transition-delay:.23s}

  /* 键盘可访问性 */
  a:focus-visible,button:focus-visible{
    outline:2px solid var(--ink);outline-offset:3px;
  }

  /* ===== 更新日历 ===== */
  .calendar{padding:56px 0 96px}
  .calendar__head{
    display:flex;align-items:baseline;gap:16px;margin-bottom:30px;
    border-bottom:1px solid var(--ink);padding-bottom:18px;
  }
  .cal__bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;margin-bottom:18px;
  }
  .cal__month{
    display:flex;align-items:baseline;gap:8px;
    font-family:var(--serif);font-weight:700;
  }
  .cal__month b{font-size:30px;letter-spacing:.02em;line-height:1}
  .cal__month span{font-size:14px;color:var(--gray);letter-spacing:.14em}
  .cal__ctrl{display:flex;align-items:center;gap:8px}
  .cal__btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
    cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;
    transition:border-color .25s ease,background-color .3s ease,transform .3s var(--ease-out);
  }
  .cal__btn:hover{border-color:var(--ink);background:var(--wash);transform:translateY(-1px)}
  .cal__btn:active{transform:scale(.94)}
  .cal__btn--today{
    width:auto;border-radius:999px;padding:0 16px;
    font-size:12px;letter-spacing:.14em;
  }
  .cal__week,.cal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal__week{margin-bottom:6px}
  .cal__week span{
    text-align:center;font-size:12px;color:var(--gray);
    letter-spacing:.14em;padding:6px 0;
  }
  .cal__cell{
    position:relative;min-height:84px;
    border:1px solid var(--line);background:var(--paper);
    padding:9px 10px;display:flex;flex-direction:column;gap:6px;
    transition:border-color .25s ease,background-color .3s ease,transform .3s var(--ease-out);
  }
  .cal__cell.is-blank{border-color:transparent;background:transparent}
  a.cal__cell:hover{border-color:var(--ink);background:var(--wash);transform:translateY(-2px)}
  .cal__num{
    font-size:13px;color:var(--gray);line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .cal__cell.has-post .cal__num{color:var(--ink);font-weight:700}
  .cal__cell.is-today .cal__num{
    width:24px;height:24px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:inline-grid;place-items:center;
  }
  .cal__label{
    font-family:var(--serif);font-size:13px;line-height:1.45;
    color:var(--ink-soft);overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .cal__dot{
    position:absolute;right:9px;bottom:9px;
    width:5px;height:5px;border-radius:50%;background:var(--ink);
  }
  .cal__grid{animation:cal-in .35s var(--ease-out)}
  @keyframes cal-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .cal__legend{
    display:flex;gap:18px;margin-top:14px;
    font-size:12px;color:var(--gray);letter-spacing:.06em;
  }
  .cal__legend i{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--ink);margin-right:6px;vertical-align:middle;
  }
  .cal__posts{margin-top:32px}
  .cal__posts-title{
    font-size:12px;color:var(--gray);letter-spacing:.2em;margin-bottom:10px;
  }
  .cal__empty{
    font-size:13px;color:var(--gray-light);
    padding:20px 4px;border-top:1px solid var(--line);
  }
  @media (max-width:640px){
    .calendar{padding:40px 0 80px}
    .cal__cell{min-height:46px;padding:6px}
    .cal__label{display:none}
    .cal__num{font-size:12px}
    .cal__cell.is-today .cal__num{width:20px;height:20px}
    .cal__dot{right:6px;bottom:6px;width:4px;height:4px}
    .cal__month b{font-size:26px}
    .cal__btn{width:34px;height:34px;font-size:15px}
  }

  /* 正文内链接 */
  .post-body a{
    color:var(--ink);border-bottom:1px solid var(--ink);
    padding-bottom:1px;

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{

      transition-duration:.001ms !important;
    }

    [data-reveal]{opacity:1 !important;transform:none !important}
  }

  /* ===== 工具 ===== */
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  // 支持正文里的 [文字](链接) 写法
  function inlineHtml(s){
    return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function(m, label, url){
      return '<a href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
    });
  }
  function formatDate(d){
    var p = d.split(".").map(function(n){return parseInt(n,10);});
    return p[0] + " 年 " + p[1] + " 月 " + p[2] + " 日";

  var reduceMotion = false;
  try{ reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){}

  /* ===== 滚动进入 ===== */
  var revealObserver = null;
  function observeReveal(){
    var nodes = document.querySelectorAll("[data-reveal]:not(.is-revealed)");
    if(!nodes.length){ return; }
    if(reduceMotion || !("IntersectionObserver" in window)){
      Array.prototype.forEach.call(nodes, function(n){ n.classList.add("is-revealed"); });
      return;
    }
    if(!revealObserver){
      revealObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting){
            en.target.classList.add("is-revealed");
            revealObserver.unobserve(en.target);
          }
        });
      }, {threshold:.12, rootMargin:"0px 0px -8% 0px"});
    }
    Array.prototype.forEach.call(nodes, function(n){ revealObserver.observe(n); });
  }

  /* ===== 轻提示 ===== */
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg){
    if(!toastEl){ return; }
    toastEl.textContent = msg;
    toastEl.classList.add("is-show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("is-show"); }, 1800);
  }

  function copyText(text, done){
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      done();
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    }else{
      fallback();
    }
  }

  /* ===== Hero 标题逐字入场 ===== */
  function splitHero(){
    var title = document.querySelector(".hero__title");
    if(!title || title.getAttribute("data-split") === "1"){ return; }
    title.setAttribute("data-split", "1");
    var text = title.textContent.trim();
    title.textContent = "";
    if(reduceMotion){
      title.textContent = text;
      var staticRule = document.querySelector(".hero__rule");
      if(staticRule){ staticRule.classList.add("is-drawn"); }
      return;
    }
    Array.prototype.forEach.call(text, function(ch, i){
      var span = document.createElement("span");
      span.className = "char";
      span.style.setProperty("--i", i);
      span.textContent = ch;
      title.appendChild(span);
    });
    var rule = document.querySelector(".hero__rule");
    if(rule){ setTimeout(function(){ rule.classList.add("is-drawn"); }, 560); }
  }

  /* ===== 渲染：首页 ===== */

  }
  function renderHome(){
    profileCount.textContent = posts.length;
    postCount.textContent = posts.length + " 篇";
    postList.innerHTML = posts.map(function(post, index){
      var wc = countWords(post.content);

            '<p class="post-item__excerpt">' + esc(post.excerpt) + '</p>' +

              '<span>' + wc + ' 字</span><span>约 ' + minutes + ' 分钟</span>' +
              '<span class="post-item__more">阅读' +

  /* ===== 打字机效果 ===== */
  var typewriterStarted = false;
  function startTypewriter(){
    if(typewriterStarted){ return; }
    typewriterStarted = true;
    var text = "一个写字的地方。";
    if(reduceMotion){ typewriterEl.textContent = text; return; }
    var i = 0;
    function step(){
      if(i <= text.length){
        typewriterEl.textContent = text.slice(0, i);
        i++;
        setTimeout(step, 130);
      }
    }
    step();
  }

  /* ===== 渲染：文章详情 ===== */

  /* ===== 渲染：日历 ===== */
  var calYear = null, calMonth = null;

  function renderCalendar(){
    if(calYear === null || calMonth === null){
      var latest = posts[0];
      posts.forEach(function(p){ if(p.date > latest.date){ latest = p; } });
      var lp = latest.date.split(".").map(Number);
      calYear = lp[0];
      calMonth = lp[1];
    }

    var map = {};
    posts.forEach(function(p){
      var pd = p.date.split(".").map(Number);
      if(pd[0] === calYear && pd[1] === calMonth){ (map[pd[2]] = map[pd[2]] || []).push(p); }
    });

    var lead = (new Date(calYear, calMonth - 1, 1).getDay() + 6) % 7;
    var total = new Date(calYear, calMonth, 0).getDate();
    var now = new Date();
    var today = (now.getFullYear() === calYear && now.getMonth() + 1 === calMonth) ? now.getDate() : 0;

    var cells = "";
    for(var b = 0; b < lead; b++){
      cells += '<span class="cal__cell is-blank" aria-hidden="true"></span>';
    }
    for(var d = 1; d <= total; d++){
      var dayPosts = map[d] || [];
      var cls = "cal__cell" + (dayPosts.length ? " has-post" : "") + (d === today ? " is-today" : "");
      var num = '<span class="cal__num">' + d + '</span>';
      if(dayPosts.length){
        var label = dayPosts[0].title + (dayPosts.length > 1 ? " +" + (dayPosts.length - 1) : "");
        var aria = calYear + " 年 " + calMonth + " 月 " + d + " 日：" + dayPosts.map(function(p){ return p.title; }).join("、");
        cells += '<a class="' + cls + '" href="#/post?id=' + dayPosts[0].id + '" title="' + esc(aria) + '" aria-label="' + esc(aria) + '">' + num +
          '<span class="cal__label">' + esc(label) + '</span><span class="cal__dot"></span></a>';
      } else {
        cells += '<div class="' + cls + '">' + num + '</div>';
      }
    }

    var monthly = posts.filter(function(p){
      var pd = p.date.split(".").map(Number);
      return pd[0] === calYear && pd[1] === calMonth;
    }).sort(function(a, b){ return a.date < b.date ? 1 : -1; });

    var rows = monthly.map(function(p){
      return '<a class="archive__item" href="#/post?id=' + p.id + '">' +
        '<span class="archive__item-time">' + esc(p.date) + '</span>' +
        '<span class="archive__item-title">' + esc(p.title) + '</span>' +
        '<span class="archive__item-tag">' + esc(p.tag) + '</span>' +
        '</a>';
    }).join("");

    document.getElementById("calendarBody").innerHTML =
      '<div class="cal__bar">' +
        '<div class="cal__month"><b>' + calYear + '</b><span>年 ' + calMonth + ' 月</span></div>' +
        '<div class="cal__ctrl">' +
          '<button class="cal__btn" type="button" data-cal="prev" aria-label="上一个月">‹</button>' +
          '<button class="cal__btn cal__btn--today" type="button" data-cal="today">本月</button>' +
          '<button class="cal__btn" type="button" data-cal="next" aria-label="下一个月">›</button>' +
        '</div>' +
      '</div>' +
      '<div class="cal__week">' + ["一","二","三","四","五","六","日"].map(function(w){ return '<span>' + w + '</span>'; }).join("") + '</div>' +
      '<div class="cal__grid">' + cells + '</div>' +
      '<div class="cal__legend"><span><i></i>有更新</span><span>共 ' + posts.length + ' 篇</span></div>' +
      '<div class="cal__posts">' +
        '<div class="cal__posts-title">本月更新</div>' +
        (rows ? '<div class="archive__list">' + rows + '</div>' : '<div class="cal__empty">这个月还没有更新。</div>') +
      '</div>';

    document.getElementById("calendarCount").textContent = "本月 " + monthly.length + " 篇";
  }

  function shiftCalendar(step){
    calMonth += step;
    if(calMonth < 1){ calMonth = 12; calYear--; }
    if(calMonth > 12){ calMonth = 1; calYear++; }
    renderCalendar();

  /* ===== 路由 ===== */
  function parseHash(){
    var raw = (location.hash || "").replace(/^#\/?/, "") || "home";
    var parts = raw.split("?");
    return {
      path: parts[0] || "home",
      params: new URLSearchParams(parts[1] || "")
    };
  }

  var routeNames = { "home":"首页", "archive":"归档", "calendar":"日历", "post":"文章", "about":"关于" };

  function route(){
    var r = parseHash();
    var views = document.querySelectorAll(".view");
    Array.prototype.forEach.call(views, function(v){ v.classList.remove("is-active"); });

    var target = document.querySelector('.view[data-route="' + r.path + '"]') || document.querySelector('.view[data-route="home"]');
    target.classList.add("is-active");

    if(r.path === "post"){ renderPost(r.params); }
    else if(r.path === "archive"){ renderArchive(); }
    else if(r.path === "calendar"){ renderCalendar(); }
    else if(r.path === "about"){ renderAbout(); }
    else { renderHome(); startTypewriter(); }

    document.title = "脆香米 · " + (routeNames[r.path] || "一个写字的地方");

    // 高亮导航
    var active = routeNames[r.path] || "首页";
    Array.prototype.forEach.call(document.querySelectorAll(".site-nav a"), function(a){
      a.classList.toggle("is-active", a.textContent === active);
    });

    closeMenu();
    window.scrollTo(0, 0);
    progress.style.width = "0px";
    observeReveal();
    updateProgress();
  }

  window.addEventListener("hashchange", route);

  /* ===== 阅读进度 ===== */
  function updateProgress(){
    var h = document.documentElement;
    var scrollTop = window.pageYOffset || h.scrollTop;
    var max = h.scrollHeight - h.clientHeight;
    var pct = max > 0 ? (scrollTop / max) * 100 : 0;
    progress.style.width = pct + "%";

    // 导航栏滚动状态
    var header = document.querySelector(".site-header");
    if(header){ header.classList.toggle("is-scrolled", scrollTop > 8); }

    // 回到顶部按钮显隐 + 环形进度
    var backTop = document.getElementById("backTop");
    if(backTop){
      backTop.classList.toggle("is-visible", scrollTop > 320);
      backTop.style.setProperty("--p", (pct / 100).toFixed(4));
    }
  }
  window.addEventListener("scroll", updateProgress, {passive:true});

  /* ===== 回到顶部 ===== */
  var backTop = document.getElementById("backTop");
  if(backTop){
    backTop.addEventListener("click", function(){
      window.scrollTo({ top:0, behavior:"smooth" });
    });
  }

  /* ===== 日历翻月 ===== */
  var calendarBodyEl = document.getElementById("calendarBody");
  if(calendarBodyEl){
    calendarBodyEl.addEventListener("click", function(e){
      var btn = e.target.closest ? e.target.closest("[data-cal]") : null;
      if(!btn){ return; }
      var act = btn.getAttribute("data-cal");
      if(act === "prev"){ shiftCalendar(-1); }
      else if(act === "next"){ shiftCalendar(1); }
      else {
        var now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth() + 1;
        renderCalendar();
      }
    });
  }

  /* ===== 移动端菜单 ===== */
  function toggleMenu(){
    var open = mobileMenu.classList.toggle("is-open");
    hamburger.classList.toggle("is-open", open);
    document.body.style.overflow = open ? "hidden" : "";
  }
  hamburger.addEventListener("click", toggleMenu);
  Array.prototype.forEach.call(mobileMenu.querySelectorAll("a"), function(a){
    a.addEventListener("click", closeMenu);
  });
  function closeMenu(){
    mobileMenu.classList.remove("is-open");
    hamburger.classList.remove("is-open");
    document.body.style.overflow = "";
  }

  /* ===== 白天/黑夜主题切换 ===== */
  function applyTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    try{ localStorage.setItem("cuixiangmi-theme", theme); }catch(e){}
    if(typeof updateCusdisTheme === "function"){ updateCusdisTheme(); }
  }
  function toggleTheme(){
    var root = document.documentElement;
    var current = root.getAttribute("data-theme") === "dark" ? "dark" : "light";
    var next = current === "dark" ? "light" : "dark";

    // 从按钮位置向外扩散目标背景色，形成流畅的切换动画
    var rect = themeToggle.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var maxR = Math.sqrt(
      Math.pow(Math.max(cx, window.innerWidth - cx), 2) +
      Math.pow(Math.max(cy, window.innerHeight - cy), 2)
    );
    var ripple = document.createElement("div");
    ripple.className = "theme-ripple is-" + next;
    ripple.style.left = cx + "px";
    ripple.style.top = cy + "px";
    document.body.appendChild(ripple);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        ripple.style.transform = "scale(" + maxR + ")";
      });
    });
    applyTheme(next);
    // 主题切换按钮累计点击10次 → 过渡文字+闪屏→彩蛋
    themeClicks++;
    if(themeClicks >= 10 && !secretShown){
      themeClicks = 0;
      triggerSecretWithIntro();
    }
    setTimeout(function(){
      if(ripple.parentNode){ ripple.parentNode.removeChild(ripple); }
    }, 700);
  }
  themeToggle.addEventListener("click", toggleTheme);

  /* ===== 毛玻璃模式切换 ===== */
  var glassToggle = document.getElementById("glassToggle");
  var rainLayer = document.getElementById("rainLayer");
  var glassMode = false;
  try{ glassMode = localStorage.getItem("cuixiangmi-glass") === "1"; }catch(e){}

  function buildRain(){
    if(rainLayer.children.length > 0){ return; }
    for(var i=0;i<90;i++){
      var drop = document.createElement("span");
      drop.style.left = (Math.random()*100) + "%";
      drop.style.height = (40 + Math.random()*80) + "px";
      drop.style.animationDuration = (0.5 + Math.random()*0.7) + "s";
      drop.style.animationDelay = (-Math.random()*2) + "s";
      drop.style.opacity = (0.3 + Math.random()*0.5).toFixed(2);
      rainLayer.appendChild(drop);
    }
  }

  function applyGlassMode(on){
    document.documentElement.classList.toggle("glass-mode", on);
    glassToggle.classList.toggle("is-active", on);
    glassToggle.setAttribute("aria-pressed", on ? "true" : "false");
    if(on){ buildRain(); }
  }

  function toggleGlassMode(){
    glassMode = !glassMode;
    try{ localStorage.setItem("cuixiangmi-glass", glassMode ? "1" : "0"); }catch(e){}
    applyGlassMode(glassMode);
  }

  glassToggle.addEventListener("click", toggleGlassMode);
  applyGlassMode(glassMode);

  /* ===== 刷新彩蛋 ===== */
  var secretLayer = document.getElementById("secretLayer");
  var secretVideo = document.getElementById("secretVideo");
  var secretAudio = document.getElementById("secretAudio");
  var secretShown = false;
  var themeClicks = 0;

  function closeSecret(){
    try{ secretVideo.pause(); }catch(e){}
    try{ secretAudio.pause(); }catch(e){}
    secretLayer.classList.remove("show");
    document.body.style.overflow = "";
  }

  // 全局预热：用户在本站任何一次点击，都为后续声音自动播放建立浏览器权限
  document.addEventListener("pointerdown", function(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === "suspended"){ ctx.resume(); }
    }catch(e){}
  }, {capture:true, once:true});

  // 全屏任意位置按下 → 立即出声音（视频上、黑边上、任何地方都可以）
  function playSecretSound(){
    if(!secretShown){ return; }
    if(secretAudio.paused){
      var p = secretAudio.play();
      if(p && p.catch){ p.catch(function(){}); }
    }
  }
  // 全屏层覆盖整个屏幕，点击任何位置都会落在这层上
  secretLayer.addEventListener("pointerdown", playSecretSound);
  secretLayer.addEventListener("touchstart", playSecretSound, {passive:true});
  secretLayer.addEventListener("click", playSecretSound);
  // 兜底：即使点在全屏层之外的角落也能出声
  document.addEventListener("pointerdown", playSecretSound);

  // 连点10次主题按钮 → 过渡文字 + 闪屏 → 彩蛋
  function triggerSecretWithIntro(){
    secretShown = true;
    // 彩蛋触发时暂停主页音乐播放器
    try{ if(musicPlayer){ musicPlayer.pause(); } }catch(e){}
    document.body.style.overflow = "hidden";
    var intro = document.getElementById("secretIntro");
    intro.classList.add("show");
    setTimeout(function(){
      intro.classList.add("flash");
      setTimeout(function(){
        intro.classList.remove("show","flash");
        secretLayer.classList.add("show");
        try{ secretVideo.load(); secretAudio.load(); }catch(e){}
        var vp = secretVideo.play();
        if(vp && vp.catch){ vp.catch(function(){}); }
        var ap = secretAudio.play();
        if(ap && ap.catch){ ap.catch(function(){}); }
      }, 450);
    }, 900);
  }

  function maybeShowSecret(){
    if(secretShown){ return; }
    var n = 0;
    try{ n = parseInt(localStorage.getItem("cuixiangmi-refresh") || "0", 10); }catch(e){}
    n += 1;
    try{ localStorage.setItem("cuixiangmi-refresh", n); }catch(e){}
    var trigger = false; // 刷新触发已废弃，改用主题按钮连点10次
    if(!trigger){ return; }
    secretShown = true;
    secretLayer.classList.add("show");
    // 强制加载并播放视频（避免加载慢黑屏）
    try{ secretVideo.load(); }catch(e){}
    var p = secretVideo.play();
    if(p && p.catch){ p.catch(function(){}); }
    // 声音：直接尝试带声播放 MP3 —— 用户与该站点已有交互时，浏览器会直接放行
    var a = secretAudio.play();
    if(a && a.catch){ a.catch(function(){}); }
  }

  // 视频完整播完 → 停音乐、自动关闭，回到博客
  secretVideo.addEventListener("ended", function(){
    try{ secretAudio.pause(); }catch(e){}
    closeSecret();
  });

  maybeShowSecret();

  /* ===== 音乐播放器（自建初始化，用快速API） ===== */
  var MUSIC_API = "https://api.injahow.cn/meting/?server=netease";
  var musicPlayer = null;
  var playlists = [
    { id: "17447185020", name: "术力口" },
    { id: "31460398", name: "东方曲" },
    { id: "606619052", name: "纯音乐" }
  ];
  var playlistIndex = 0;

  function loadPlaylist(pl, cb){
    fetch(MUSIC_API + "&type=playlist&id=" + pl.id)
      .then(function(r){ return r.json(); })
      .then(function(list){
        if(!list || !list.length){ if(cb) cb(null); return; }
        var audio = list.map(function(s){
          // 从injahow URL提取歌曲ID，改用网易云外链直连（避免302重定向导致播放失败）
          var songId = "";
          if(s.url && s.url.indexOf("id=") > -1){
            var m = s.url.match(/id=(\d+)/);
            if(m){ songId = m[1]; }
          }
          return {
            name: s.name || s.title,
            artist: s.artist || s.author,
            url: songId ? "https://music.163.com/song/media/outer/url?id=" + songId + ".mp3" : s.url,
            cover: s.pic,
            lrc: s.lrc
          };
        });
        if(cb) cb(audio);
      })
      .catch(function(){ if(cb) cb(null); });
  }

  function initMusicPlayer(){
    // APlayer 用 defer 加载，脚本执行时可能还没就绪，等 window.load 再初始化
    if(typeof APlayer === "undefined"){
      if(!initMusicPlayer.waiting){
        initMusicPlayer.waiting = true;
        window.addEventListener("load", initMusicPlayer, {once:true});
      }
      return;
    }
    loadPlaylist(playlists[0], function(audio){
      if(!audio){ return; }
      musicPlayer = new APlayer({
        container: document.getElementById("aplayer"),
        audio: audio,
        mode: "random",
        listFolded: true,
        preload: "none"
      });
      // 按钮显示当前歌单名
      var btn = document.getElementById("musicSwitchBtn");
      if(btn){ btn.textContent = playlists[0].name; }
    });
  }
  initMusicPlayer();

  function switchPlaylist(){
    if(!musicPlayer){ return; }
    playlistIndex = (playlistIndex + 1) % playlists.length;
    var pl = playlists[playlistIndex];
    var btn = document.getElementById("musicSwitchBtn");
    btn.textContent = "加载中";
    btn.disabled = true;
    loadPlaylist(pl, function(audio){
      if(!audio){
        btn.textContent = "失败";
        setTimeout(function(){ btn.textContent = "换一批"; btn.disabled = false; }, 1500);
        return;
      }
      musicPlayer.list.clear();
      audio.forEach(function(s){ musicPlayer.list.add(s); });
      musicPlayer.play();
      btn.textContent = pl.name;
      btn.disabled = false;
    });
  }
  // 用事件委托绑定切换按钮（按钮在body末尾，script执行时可能还不存在）
  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "musicSwitchBtn"){
      switchPlaylist();
    }
  });

  /* ===== 复制群号 ===== */
  document.addEventListener("click", function(e){
    var el = e.target && e.target.closest ? e.target.closest("[data-copy]") : null;
    if(!el){ return; }
    var text = el.getAttribute("data-copy");
    if(!text){ return; }
    e.preventDefault();
    copyText(text, function(){ showToast("群号已复制：" + text); });
  });

  /* ===== 启动 ===== */
  var initialTheme = "light";
  try{
    var savedTheme = localStorage.getItem("cuixiangmi-theme");
    if(savedTheme === "light" || savedTheme === "dark"){ initialTheme = savedTheme; }
  }catch(e){}
  applyTheme(initialTheme);
  splitHero();
  route();
})();
</script>
</body>
